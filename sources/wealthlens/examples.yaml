# Few-shot question -> SQL pairs for the WealthLens source (PostgreSQL).
# Every example is executed against the seeded database by tests/integration/test_phase1_postgres.py,
# so a schema change that breaks one fails CI. `tables` must list every table the SQL touches.
examples:
  - question: How much did I spend on groceries last month?
    tables: [transactions, categories]
    sql: |
      SELECT COALESCE(SUM(t.amount), 0) AS grocery_spend
      FROM transactions t
      JOIN categories c ON c.id = t.category_id
      WHERE c.name = 'Groceries'
        AND c.kind = 'expense'
        AND t.txn_type = 'debit'
        AND t.txn_date >= date_trunc('month', {TODAY}) - interval '1 month'
        AND t.txn_date <  date_trunc('month', {TODAY})

  - question: Show my monthly spend for the last 6 months
    tables: [transactions, categories]
    sql: |
      SELECT date_trunc('month', t.txn_date)::date AS month, SUM(t.amount) AS spend
      FROM transactions t
      JOIN categories c ON c.id = t.category_id
      WHERE c.kind = 'expense'
        AND t.txn_type = 'debit'
        AND t.txn_date >= date_trunc('month', {TODAY}) - interval '6 months'
      GROUP BY 1
      ORDER BY 1

  - question: What are my top 5 expense categories this year?
    tables: [transactions, categories]
    sql: |
      SELECT c.name AS category, SUM(t.amount) AS spend
      FROM transactions t
      JOIN categories c ON c.id = t.category_id
      WHERE c.kind = 'expense'
        AND t.txn_type = 'debit'
        AND t.txn_date >= date_trunc('year', {TODAY})
      GROUP BY c.name
      ORDER BY spend DESC
      LIMIT 5

  - question: What was my savings rate in 2025?
    tables: [transactions, categories]
    sql: |
      WITH totals AS (
        SELECT
          SUM(CASE WHEN c.kind = 'income'  AND t.txn_type = 'credit' THEN t.amount ELSE 0 END) AS income,
          SUM(CASE WHEN c.kind = 'expense' AND t.txn_type = 'debit'  THEN t.amount ELSE 0 END) AS spend
        FROM transactions t
        JOIN categories c ON c.id = t.category_id
        WHERE t.txn_date >= DATE '2025-01-01' AND t.txn_date < DATE '2026-01-01'
      )
      SELECT income, spend, ROUND(100.0 * (income - spend) / NULLIF(income, 0), 1) AS savings_rate_pct
      FROM totals

  - question: What is the current market value of my holdings by asset type?
    tables: [holdings, assets, asset_prices]
    sql: |
      WITH latest AS (
        SELECT DISTINCT ON (asset_id) asset_id, close
        FROM asset_prices
        ORDER BY asset_id, price_date DESC
      )
      SELECT a.asset_type, SUM(h.quantity * l.close) AS market_value
      FROM holdings h
      JOIN assets a ON a.id = h.asset_id
      JOIN latest l ON l.asset_id = h.asset_id
      GROUP BY a.asset_type
      ORDER BY market_value DESC

  - question: Which categories went over budget in September 2026?
    tables: [budgets, transactions, categories]
    sql: |
      SELECT c.name AS category, b.amount AS budget, COALESCE(s.spend, 0) AS spend
      FROM budgets b
      JOIN categories c ON c.id = b.category_id
      LEFT JOIN (
        SELECT category_id, SUM(amount) AS spend
        FROM transactions
        WHERE txn_type = 'debit'
          AND txn_date >= DATE '2026-09-01' AND txn_date < DATE '2026-10-01'
        GROUP BY category_id
      ) s ON s.category_id = b.category_id
      WHERE b.month = DATE '2026-09-01'
        AND COALESCE(s.spend, 0) > b.amount
      ORDER BY COALESCE(s.spend, 0) - b.amount DESC

  - question: How far along am I on each savings goal?
    tables: [goals]
    sql: |
      SELECT name, current_amount, target_amount,
             ROUND(100.0 * current_amount / NULLIF(target_amount, 0), 1) AS progress_pct,
             target_date
      FROM goals
      ORDER BY target_date

  - question: List my accounts with the number of transactions in each
    tables: [accounts, transactions]
    sql: |
      SELECT a.name, a.account_type, COUNT(t.id) AS transactions
      FROM accounts a
      LEFT JOIN transactions t ON t.account_id = a.id
      GROUP BY a.id, a.name, a.account_type
      ORDER BY transactions DESC
