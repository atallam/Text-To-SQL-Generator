  - {id: wj01, case: groceries_last_month, category: wrong_join, note: joins categories on the account id, sql: "SELECT COALESCE(SUM(t.amount), 0) AS grocery_spend FROM transactions t JOIN categories c ON c.id = t.account_id WHERE c.name = 'Groceries' AND c.kind = 'expense' AND t.txn_type = 'debit' AND t.txn_date >= DATE '2026-08-01' AND t.txn_date < DATE '2026-09-01'"}
  - {id: wj02, case: market_value_by_type, category: wrong_join, note: joins every historical price instead of the latest (fan-out), sql: "SELECT a.asset_type, SUM(h.quantity * p.close) AS market_value FROM holdings h JOIN assets a ON a.id = h.asset_id JOIN asset_prices p ON p.asset_id = h.asset_id GROUP BY a.asset_type ORDER BY market_value DESC"}
  - {id: wj03, case: over_budget_sep, category: wrong_join, note: joins spend to the budget through the account id, sql: "SELECT c.name AS category, b.amount AS budget, COALESCE(s.spend, 0) AS spend FROM budgets b JOIN categories c ON c.id = b.category_id LEFT JOIN (SELECT account_id, SUM(amount) AS spend FROM transactions WHERE txn_type = 'debit' AND txn_date >= DATE '2026-09-01' AND txn_date < DATE '2026-10-01' GROUP BY account_id) s ON s.account_id = b.category_id WHERE b.month = DATE '2026-09-01' AND COALESCE(s.spend, 0) > b.amount ORDER BY 3 - 2 DESC"}
  - {id: wj04, case: txns_per_account, category: wrong_join, note: joins transactions on category id, sql: "SELECT a.name, COUNT(t.id) AS transactions FROM accounts a LEFT JOIN transactions t ON t.category_id = a.id GROUP BY a.id, a.name ORDER BY a.name"}
  - {id: wj05, case: unrealized_gain_by_currency, category: wrong_join, note: all historical prices joined (fan-out), sql: "SELECT a.currency, SUM(h.quantity * (p.close - h.avg_cost)) AS unrealized_gain FROM holdings h JOIN assets a ON a.id = h.asset_id JOIN asset_prices p ON p.asset_id = h.asset_id GROUP BY a.currency ORDER BY a.currency"}
  - {id: wj06, case: spend_by_institution_aug, category: wrong_join, note: extra join to holdings repeats every transaction, sql: "SELECT a.institution, SUM(t.amount) AS spend FROM transactions t JOIN accounts a ON a.id = t.account_id JOIN categories c ON c.id = t.category_id JOIN holdings h ON h.account_id = a.id WHERE c.kind = 'expense' AND t.txn_type = 'debit' AND t.txn_date >= DATE '2026-08-01' AND t.txn_date < DATE '2026-09-01' GROUP BY a.institution ORDER BY a.institution"}
  - {id: wj07, case: spend_by_institution_aug, category: wrong_join, note: joins categories on the parent id, sql: "SELECT a.institution, SUM(t.amount) AS spend FROM transactions t JOIN accounts a ON a.id = t.account_id JOIN categories c ON c.parent_id = t.category_id WHERE c.kind = 'expense' AND t.txn_type = 'debit' AND t.txn_date >= DATE '2026-08-01' AND t.txn_date < DATE '2026-09-01' GROUP BY a.institution ORDER BY a.institution"}
  - {id: wj08, case: budget_by_category_sep, category: wrong_join, note: joins every transaction of the category, repeating each budget row, sql: "SELECT c.name AS category, b.amount AS budget FROM budgets b JOIN categories c ON c.id = b.category_id JOIN transactions t ON t.category_id = b.category_id WHERE b.month = DATE '2026-09-01' ORDER BY c.name"}
  - {id: wj09, case: top5_categories_year, category: wrong_join, note: joins category by account id, sql: "SELECT c.name AS category, SUM(t.amount) AS spend FROM transactions t JOIN categories c ON c.id = t.account_id WHERE c.kind = 'expense' AND t.txn_type = 'debit' AND t.txn_date >= DATE '2026-01-01' GROUP BY c.name ORDER BY spend DESC LIMIT 5"}
