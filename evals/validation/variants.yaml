correct:
  - {id: ok01, case: groceries_last_month, note: subquery on category id and BETWEEN dates, sql: "SELECT COALESCE(SUM(amount), 0) AS total FROM transactions WHERE category_id IN (SELECT id FROM categories WHERE name = 'Groceries' AND kind = 'expense') AND txn_type = 'debit' AND txn_date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31'"}
  - {id: ok02, case: groceries_last_month, note: conditional aggregation, sql: "SELECT SUM(CASE WHEN t.txn_type = 'debit' THEN t.amount ELSE 0 END) AS spent FROM transactions t JOIN categories c ON c.id = t.category_id WHERE c.name = 'Groceries' AND c.kind = 'expense' AND date_trunc('month', t.txn_date) = DATE '2026-08-01'"}
  - {id: ok03, case: monthly_spend_6m, note: CTE then aggregate, sql: "WITH spend AS (SELECT t.txn_date, t.amount FROM transactions t JOIN categories c ON c.id = t.category_id WHERE c.kind = 'expense' AND t.txn_type = 'debit') SELECT date_trunc('month', txn_date)::date AS m, SUM(amount) AS total FROM spend WHERE txn_date >= DATE '2026-03-01' GROUP BY 1 ORDER BY 1"}
  - {id: ok04, case: top5_categories_year, note: window function ranking, sql: "SELECT category, spend FROM (SELECT c.name AS category, SUM(t.amount) AS spend, RANK() OVER (ORDER BY SUM(t.amount) DESC) AS r FROM transactions t JOIN categories c ON c.id = t.category_id WHERE c.kind = 'expense' AND t.txn_type = 'debit' AND t.txn_date >= DATE '2026-01-01' GROUP BY c.name) x WHERE r <= 5 ORDER BY spend DESC"}
  - {id: ok05, case: savings_rate_2025, note: two scalar subqueries, sql: "SELECT ROUND(100.0 * (i - s) / NULLIF(i, 0), 1) AS rate FROM (SELECT (SELECT SUM(t.amount) FROM transactions t JOIN categories c ON c.id = t.category_id WHERE c.kind = 'income' AND t.txn_type = 'credit' AND EXTRACT(year FROM t.txn_date) = 2025) AS i, (SELECT SUM(t.amount) FROM transactions t JOIN categories c ON c.id = t.category_id WHERE c.kind = 'expense' AND t.txn_type = 'debit' AND EXTRACT(year FROM t.txn_date) = 2025) AS s) z"}
  - {id: ok06, case: market_value_by_type, note: correlated subquery for the latest price, sql: "SELECT a.asset_type, SUM(h.quantity * (SELECT p.close FROM asset_prices p WHERE p.asset_id = h.asset_id ORDER BY p.price_date DESC LIMIT 1)) AS mv FROM holdings h JOIN assets a ON a.id = h.asset_id GROUP BY a.asset_type ORDER BY mv DESC"}
  - {id: ok07, case: over_budget_sep, note: aggregates before joining with a HAVING-style filter, sql: "WITH spend AS (SELECT category_id, SUM(amount) AS s FROM transactions WHERE txn_type = 'debit' AND txn_date >= DATE '2026-09-01' AND txn_date <= DATE '2026-09-30' GROUP BY category_id) SELECT c.name, b.amount, spend.s FROM budgets b JOIN categories c ON c.id = b.category_id JOIN spend ON spend.category_id = b.category_id WHERE b.month = DATE '2026-09-01' AND spend.s > b.amount ORDER BY spend.s - b.amount DESC"}
  - {id: ok08, case: goal_progress, note: same ratio with a cast and a different order, sql: "SELECT name, ROUND((current_amount::numeric / NULLIF(target_amount, 0)) * 100, 1) AS pct FROM goals ORDER BY target_date, name"}
  - {id: ok09, case: txns_per_account, note: correlated count subquery, sql: "SELECT a.name, (SELECT COUNT(*) FROM transactions t WHERE t.account_id = a.id) AS n FROM accounts a ORDER BY a.name"}
  - {id: ok10, case: income_last_month, note: month extracted, sql: "SELECT COALESCE(SUM(t.amount), 0) AS earned FROM transactions t WHERE t.txn_type = 'credit' AND t.category_id IN (SELECT id FROM categories WHERE kind = 'income') AND EXTRACT(year FROM t.txn_date) = 2026 AND EXTRACT(month FROM t.txn_date) = 8"}
  - {id: ok11, case: unrealized_gain_by_currency, note: window function for the latest price, sql: "WITH ranked AS (SELECT asset_id, close, ROW_NUMBER() OVER (PARTITION BY asset_id ORDER BY price_date DESC) AS rn FROM asset_prices) SELECT a.currency, SUM(h.quantity * (r.close - h.avg_cost)) AS gain FROM holdings h JOIN assets a ON a.id = h.asset_id JOIN ranked r ON r.asset_id = h.asset_id AND r.rn = 1 GROUP BY a.currency ORDER BY a.currency"}
  - {id: ok12, case: spend_by_institution_aug, note: pre-aggregated per account then rolled up, sql: "WITH per_account AS (SELECT t.account_id, SUM(t.amount) AS s FROM transactions t JOIN categories c ON c.id = t.category_id WHERE c.kind = 'expense' AND t.txn_type = 'debit' AND t.txn_date >= DATE '2026-08-01' AND t.txn_date < DATE '2026-09-01' GROUP BY t.account_id) SELECT a.institution, SUM(p.s) AS total FROM per_account p JOIN accounts a ON a.id = p.account_id GROUP BY a.institution ORDER BY a.institution"}
  - {id: ok13, case: budget_by_category_sep, note: subquery form, sql: "SELECT (SELECT name FROM categories c WHERE c.id = b.category_id) AS cat, b.amount FROM budgets b WHERE b.month = DATE '2026-09-01' ORDER BY cat"}
  - {id: ok14, case: top5_categories_year, note: ordering by position with a tiebreaker, sql: "SELECT c.name, SUM(t.amount) AS total FROM categories c JOIN transactions t ON t.category_id = c.id WHERE c.kind = 'expense' AND t.txn_type = 'debit' AND t.txn_date >= DATE '2026-01-01' AND t.txn_date <= DATE '2026-12-31' GROUP BY c.name ORDER BY 2 DESC, 1 LIMIT 5"}
