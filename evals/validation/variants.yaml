# Labeled hallucination-detection set for the WealthLens source.
#
# `cases`   : a question and its reference SQL (the answer a careful analyst would write).
# `wrong`   : plausible-but-wrong SQL for that question, labeled by the way it is wrong:
#               wrong_join | wrong_filter | wrong_aggregation | wrong_date_range
#             The detector must flag these (recall).
# `correct` : different-looking SQL that is RIGHT for the same question. The detector must NOT flag these
#             (false-positive rate).
#
# `evals/validation_set.py` executes everything on the seeded database and records whether each wrong
# variant actually returns different data from the reference ("detectable on this data"). Variants that
# happen to return identical rows are reported separately and excluded from recall.
# "As of" date for relative phrases is 2026-09-30 (the demo data's end): last month = August 2026.
cases:
  groceries_last_month:
    question: How much did I spend on groceries last month?
    reference: |
      SELECT COALESCE(SUM(t.amount), 0) AS grocery_spend
      FROM transactions t JOIN categories c ON c.id = t.category_id
      WHERE c.name = 'Groceries' AND c.kind = 'expense' AND t.txn_type = 'debit'
        AND t.txn_date >= DATE '2026-08-01' AND t.txn_date < DATE '2026-09-01'
  monthly_spend_6m:
    question: Show my monthly spend for the last 6 months
    reference: |
      SELECT date_trunc('month', t.txn_date)::date AS month, SUM(t.amount) AS spend
      FROM transactions t JOIN categories c ON c.id = t.category_id
      WHERE c.kind = 'expense' AND t.txn_type = 'debit' AND t.txn_date >= DATE '2026-03-01'
      GROUP BY 1 ORDER BY 1
  top5_categories_year:
    question: What are my top 5 expense categories this year?
    reference: |
      SELECT c.name AS category, SUM(t.amount) AS spend
      FROM transactions t JOIN categories c ON c.id = t.category_id
      WHERE c.kind = 'expense' AND t.txn_type = 'debit' AND t.txn_date >= DATE '2026-01-01'
      GROUP BY c.name ORDER BY spend DESC LIMIT 5
  savings_rate_2025:
    question: What was my savings rate in 2025?
    reference: |
      WITH totals AS (
        SELECT SUM(CASE WHEN c.kind = 'income' AND t.txn_type = 'credit' THEN t.amount ELSE 0 END) AS income,
               SUM(CASE WHEN c.kind = 'expense' AND t.txn_type = 'debit' THEN t.amount ELSE 0 END) AS spend
        FROM transactions t JOIN categories c ON c.id = t.category_id
        WHERE t.txn_date >= DATE '2025-01-01' AND t.txn_date < DATE '2026-01-01'
      )
      SELECT ROUND(100.0 * (income - spend) / NULLIF(income, 0), 1) AS savings_rate_pct FROM totals
  market_value_by_type:
    question: What is the current market value of my holdings by asset type?
    reference: |
      WITH latest AS (SELECT DISTINCT ON (asset_id) asset_id, close FROM asset_prices ORDER BY asset_id, price_date DESC)
      SELECT a.asset_type, SUM(h.quantity * l.close) AS market_value
      FROM holdings h JOIN assets a ON a.id = h.asset_id JOIN latest l ON l.asset_id = h.asset_id
      GROUP BY a.asset_type ORDER BY market_value DESC
  over_budget_sep:
    question: Which categories went over budget in September 2026?
    reference: |
      SELECT c.name AS category, b.amount AS budget, COALESCE(s.spend, 0) AS spend
      FROM budgets b JOIN categories c ON c.id = b.category_id
      LEFT JOIN (SELECT category_id, SUM(amount) AS spend FROM transactions
                 WHERE txn_type = 'debit' AND txn_date >= DATE '2026-09-01' AND txn_date < DATE '2026-10-01'
                 GROUP BY category_id) s ON s.category_id = b.category_id
      WHERE b.month = DATE '2026-09-01' AND COALESCE(s.spend, 0) > b.amount
      ORDER BY 3 - 2 DESC
  goal_progress:
    question: How far along am I on each savings goal?
    reference: |
      SELECT name, ROUND(100.0 * current_amount / NULLIF(target_amount, 0), 1) AS progress_pct
      FROM goals ORDER BY target_date
  txns_per_account:
    question: List my accounts with the number of transactions in each
    reference: |
      SELECT a.name, COUNT(t.id) AS transactions
      FROM accounts a LEFT JOIN transactions t ON t.account_id = a.id
      GROUP BY a.id, a.name ORDER BY a.name
  income_last_month:
    question: How much income did I earn last month?
    reference: |
      SELECT COALESCE(SUM(t.amount), 0) AS income
      FROM transactions t JOIN categories c ON c.id = t.category_id
      WHERE c.kind = 'income' AND t.txn_type = 'credit'
        AND t.txn_date >= DATE '2026-08-01' AND t.txn_date < DATE '2026-09-01'
  unrealized_gain_by_currency:
    question: What is my total unrealized gain per currency?
    reference: |
      WITH latest AS (SELECT DISTINCT ON (asset_id) asset_id, close FROM asset_prices ORDER BY asset_id, price_date DESC)
      SELECT a.currency, SUM(h.quantity * (l.close - h.avg_cost)) AS unrealized_gain
      FROM holdings h JOIN assets a ON a.id = h.asset_id JOIN latest l ON l.asset_id = h.asset_id
      GROUP BY a.currency ORDER BY a.currency
  spend_by_institution_aug:
    question: How much did I spend at each institution in August 2026?
    reference: |
      SELECT a.institution, SUM(t.amount) AS spend
      FROM transactions t JOIN accounts a ON a.id = t.account_id JOIN categories c ON c.id = t.category_id
      WHERE c.kind = 'expense' AND t.txn_type = 'debit'
        AND t.txn_date >= DATE '2026-08-01' AND t.txn_date < DATE '2026-09-01'
      GROUP BY a.institution ORDER BY a.institution
  budget_by_category_sep:
    question: What is my budget for each category in September 2026?
    reference: |
      SELECT c.name AS category, b.amount AS budget
      FROM budgets b JOIN categories c ON c.id = b.category_id
      WHERE b.month = DATE '2026-09-01' ORDER BY c.name

wrong:
